services:
  flutter:
    build:
      context: docker/flutter
      args:
        UID: ${HOST_UID:-1000}
        GID: ${HOST_GID:-1000}
    image: mydiary-flutter:3.47.7
    container_name: mydiary-flutter
    # Red del host: llega al backend local (localhost:9008) y a los móviles con depuración inalámbrica.
    network_mode: host
    working_dir: /app
    # Vivo entre comandos: el servidor de adb (y el emparejamiento con el móvil) está dentro.
    command: sleep infinity
    init: true
    volumes:
      - .:/app
      - pub-cache:/home/builder/.pub-cache
      - gradle-cache:/home/builder/.gradle

  # Opcional, solo para desarrollar sin móvil Android: make emulator-up (no lo arranca make up).
  emulator:
    profiles: [emulator]
    build:
      context: docker/emulator
    image: mydiary-emulator:3.47.7
    container_name: mydiary-emulator
    # Red del host: el adb de mydiary-flutter lo detecta solo (emulator-5554) y
    # dentro del emulador 10.0.2.2 es el backend local.
    network_mode: host
    devices:
      - /dev/kvm
    environment:
      DISPLAY: ${DISPLAY:-:0}
      QT_X11_NO_MITSHM: "1"
      # Micrófono: el servidor PulseAudio del escritorio (o pipewire-pulse).
      PULSE_SERVER: unix:/run/pulse/native
    volumes:
      # Ventana en el escritorio del host (X11/XWayland), con la cookie de la sesión actual.
      - /tmp/.X11-unix:/tmp/.X11-unix:ro
      - ${XAUTHORITY:-/dev/null}:/home/builder/.Xauthority:ro
      - ${XDG_RUNTIME_DIR:-/run/user/1000}/pulse/native:/run/pulse/native
      # Estado del emulador (app instalada, datos) entre arranques; make emulator-reset lo borra.
      - emulator-avd:/home/builder/.android/avd

volumes:
  pub-cache:
  gradle-cache:
  emulator-avd:
